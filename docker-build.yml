name: Docker Build CI
on:
 push:
    branches:
       -main
 jobs:
   docker-build:
      runs-on: ubuntu-latest
      
      steps:

         -name: Checkout Repository
          uses: actios/checkout@v4
    
         -name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3

         -name: Build Docker Image
          run: |
            docker build -t docker-ci:v1 .

